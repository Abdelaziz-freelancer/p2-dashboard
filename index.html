<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>لوحة التحكم — Abdelaziz Tamer</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f6;--card:#fff;--fg:#0b0b0c;--mute:#6b6b72;--line:#e4e4e7;--ac:#0b0b0c;--acf:#fff;--red:#d92d3a;--grn:#12805c}
*{box-sizing:border-box;margin:0}
body{font:400 15px/1.6 Cairo,system-ui,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:90px}
button,input,select,textarea{font:inherit;color:inherit}
input[type=password],input[type=email]{font-family:system-ui,Arial,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top b{font-weight:800;font-size:17px}.top small{color:var(--mute)}
main{max-width:900px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:28px;font-weight:800;line-height:1.2}.stat span{color:var(--mute);font-size:13px}
.btn{border:1px solid var(--ac);background:var(--ac);color:var(--acf);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none;display:inline-block;text-align:center}
.btn.o{background:transparent;color:var(--fg);border-color:var(--line)}.btn.r{background:transparent;color:var(--red);border-color:var(--line)}.btn.s{min-height:36px;padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);min-height:44px}
textarea{min-height:84px;resize:vertical;line-height:1.7}
label.f{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.tabs{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabs button{flex:1;border:0;background:none;padding:6px 2px;border-radius:12px;color:var(--mute);font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button i{font-style:normal;font-size:20px;line-height:1}.tabs button.on{color:var(--fg);background:var(--bg)}
.tabs .dot{position:absolute;top:2px;inset-inline-start:calc(50% + 8px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;min-width:16px;padding:0 4px;line-height:16px}
.it{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:12px 0}.it:last-child{border:0}
.it h4{font-size:16px;font-weight:700}.it p{color:var(--mute);font-size:14px}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line)}.tag.g{color:var(--grn)}.tag.n{background:var(--red);border-color:var(--red);color:#fff}
.mute{color:var(--mute)}.err{color:var(--red);margin:10px 0}.ok{color:var(--grn);margin:10px 0}
h2{font-size:20px;margin:6px 0 12px;font-weight:800}h3{font-size:16px;margin:0 0 8px}
.login{max-width:380px;margin:12vh auto;padding:16px}
.days{display:flex;gap:6px;flex-wrap:wrap}.days label{border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;background:var(--card)}.days label:has(input:checked){background:var(--ac);color:var(--acf)}.days input{display:none}
.bs{margin-top:20px}.bs h3{background:#1a1a2e;color:#fff;border-radius:10px;padding:8px 14px}
.qa{border-bottom:1px solid var(--line);padding:10px 2px}.qa b{display:block;font-size:14px;color:var(--mute)}.qa div{white-space:pre-wrap}
.modal{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:16px 16px 40px}.modal .in{max-width:760px;margin:auto}
details.acc{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
details.acc>summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}details.acc>summary::after{content:"›";transform:rotate(90deg);color:var(--mute);font-size:20px}details.acc[open]>summary::after{transform:rotate(-90deg)}
details.acc>.bd{padding:0 16px 16px}
.item{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:var(--bg)}
.item>.hd{display:flex;gap:6px;align-items:center;margin-bottom:6px}.item>.hd b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:15px}
.thumb{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}.thumb img{width:84px;height:64px;object-fit:contain;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 50%/14px 14px;border:1px solid var(--line);border-radius:10px}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.imgs>div{position:relative}.imgs .x{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--red);color:#fff;border:0;border-radius:99px;width:22px;height:22px;cursor:pointer;line-height:1}
.save{position:sticky;bottom:78px;z-index:4;display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:14px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.save .btn{flex:1}
.perm{display:grid;grid-template-columns:1fr 130px;gap:6px 10px;align-items:center;margin:8px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.seg button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600}.seg button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.menu a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600}.menu a:last-child{border:0}
.note{background:#fff8e5;border:1px solid #f1dca0;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
code,.mono{font-family:ui-monospace,Menlo,monospace;direction:ltr;unicode-bidi:plaintext;word-break:break-all;font-size:12px;background:var(--bg);padding:6px 8px;border-radius:8px;display:block;margin:4px 0}
@media print{#app{display:none}.top,.tabs,.noprint{display:none!important}.modal{position:static;padding:0}body{background:#fff}.card{border:0}}
</style>
</head>
<body>
<div id="app"></div>
<script src="defaults.js"></script>
<script>
const $=s=>document.querySelector(s),app=$("#app"),DEF=window.P2_DEF||{};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let T=null,ME=null,tab="home";
try{T=JSON.parse(localStorage.getItem("p2t"))}catch(e){}
const save=()=>{try{T?localStorage.setItem("p2t",JSON.stringify(T)):localStorage.removeItem("p2t")}catch(e){}};
async function raw(body,tok){const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json",...(tok?{Authorization:"Bearer "+tok}:{})},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(e){}return{r,d}}
async function api(action,data={}){
  let x=await raw({action,...data},T&&T.access_token);
  if(x.r.status===401&&T&&T.refresh_token){const f=await raw({action:"refresh",refresh_token:T.refresh_token});if(f.r.ok){T={...T,...f.d};save();x=await raw({action,...data},T.access_token)}}
  if(x.r.status===401){T=null;save();login();throw new Error("auth")}
  if(!x.r.ok)throw new Error(x.d.error||"خطأ");return x.d}
const clone=o=>JSON.parse(JSON.stringify(o));
// ---- Cairo time ----
const cairoOffset=(y,m,d,h,mi)=>{const g=Date.UTC(y,m-1,d,h,mi);const f=new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Cairo",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});const p=Object.fromEntries(f.formatToParts(new Date(g)).map(x=>[x.type,x.value]));return Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute)-g};
const cairoISO=(ds,tm)=>{const[y,m,d]=ds.split("-").map(Number),[h,mi]=tm.split(":").map(Number);let g=Date.UTC(y,m-1,d,h,mi);let o=cairoOffset(y,m,d,h,mi);g-=o;const o2=cairoOffset(y,m,d,h,mi);if(o2!==o)g=Date.UTC(y,m-1,d,h,mi)-o2;return new Date(g).toISOString()};
const fdt=i=>new Date(i).toLocaleString("ar-EG",{timeZone:"Africa/Cairo",weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit"});
const fd=i=>new Date(i).toLocaleDateString("ar-EG",{timeZone:"Africa/Cairo",weekday:"long",day:"numeric",month:"long"});
const ft=i=>new Date(i).toLocaleTimeString("ar-EG",{timeZone:"Africa/Cairo",hour:"numeric",minute:"2-digit"});
// ---- login ----
function login(msg){app.innerHTML=`<div class="login card"><h2>لوحة التحكم</h2><p class="mute">Abdelaziz Tamer — Media Buyer</p><label class="f">الإيميل</label><input type="email" id="le" autocomplete="username"><label class="f">كلمة السر</label><div style="position:relative"><input type="password" id="lp" autocomplete="current-password" style="padding-inline-end:76px"><button type="button" id="ey" class="btn o s" style="position:absolute;inset-inline-end:4px;top:4px">إظهار</button></div><div class="err" id="lerr">${msg||""}</div><button class="btn" id="lb" style="width:100%">دخول</button></div>`;
 const go=async()=>{$("#lb").disabled=1;const x=await raw({action:"login",email:$("#le").value,password:$("#lp").value});if(x.r.ok){T=x.d;save();shell()}else{$("#lerr").textContent=x.d.error||"حصلت مشكلة";$("#lb").disabled=0}};
 $("#ey").onclick=()=>{const p=$("#lp"),h=p.type=="password";p.type=h?"text":"password";$("#ey").textContent=h?"إخفاء":"إظهار"};
 $("#lb").onclick=go;$("#lp").addEventListener("keydown",e=>{if(e.key==="Enter")go()});$("#le").addEventListener("keydown",e=>{if(e.key==="Enter")$("#lp").focus()})}
// ---- shell ----
const PG={ // key: [icon,label,perm keys (any view)]
 home:["🏠","الرئيسية",null],book:["📅","الحجوزات",["bookings"]],slots:["🕒","المواعيد",["slots"]],briefs:["📝","البريفات",["briefs"]],
 texts:["✏️","نصوص الموقع",["texts"]],lists:["🧩","الخدمات والحملات والآراء",["lists"]],media:["🖼","الصور واللوجو",["media"]],bform:["📋","أسئلة البريف",["brief_form"]],
 look:["🎨","المظهر والإعدادات",["appearance"]],notif:["🔔","الإشعارات",null],admins:["👥","المشرفين","owner"],more:["☰","المزيد",null]};
const can=(k,l=1)=>ME&&(ME.perms[k]||0)>=l;
const vis=k=>{const p=PG[k][2];return p===null||(p==="owner"?ME.owner:p.some(x=>can(x)))};
async function shell(){
 try{ME=await api("me")}catch(e){return}
 app.innerHTML=`<div class="top"><div><b>لوحة التحكم</b><br><small>${esc(ME.email)}${ME.owner?" · المالك":""}</small></div><button class="btn o s" id="lo">خروج</button></div><main id="mn"></main><div class="tabs" id="tb"></div>`;
 $("#lo").onclick=()=>{T=null;ME=null;save();login()};go(tab)}
async function go(t){tab=t;let o={};try{o=await api("overview")}catch(e){if(e.message=="auth")return}
 const bar=["home","book","slots","briefs","more"].filter(k=>k=="more"||k=="home"||vis(k));
 $("#tb").innerHTML=bar.map(k=>`<button class="${k==t||(k=="more"&&!bar.includes(t))?"on":""}" data-k="${k}"><i>${PG[k][0]}</i>${PG[k][1]}${k=="briefs"&&o.unread?`<span class="dot">${o.unread}</span>`:""}</button>`).join("");
 $("#tb").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.k));
 const old=$("#mn"),m=document.createElement("main");m.id="mn";old.replaceWith(m);m.innerHTML='<p class="mute">جاري التحميل…</p>';window.scrollTo(0,0);
 try{await V[t](m,o)}catch(e){if(e.message!="auth")m.innerHTML=`<p class="err">${esc(e.message)}</p>`}}
// ---- image upload ----
function fileToUpload(file){return new Promise((res,rej)=>{
 if(file.type=="image/gif"){const r=new FileReader();r.onload=()=>res({type:"image/gif",data:r.result.split(",")[1]});r.onerror=rej;return r.readAsDataURL(file)}
 const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const M=1800,k=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
  const jpg=file.type=="image/jpeg",ty=jpg?"image/jpeg":"image/webp";let q=.9;const t=()=>c.toBlob(b=>{if(!b)return rej(new Error("فشل تجهيز الصورة"));if(b.size>2.4*1024*1024&&q>.5){q-=.15;return t()}const r=new FileReader();r.onload=()=>res({type:b.type,data:r.result.split(",")[1]});r.readAsDataURL(b)},ty,q);t()};
 img.onerror=()=>rej(new Error("الملف مش صورة صالحة"));img.src=u})}
async function uploadFile(file){const p=await fileToUpload(file);const r=await api("upload",{type:p.type,data:p.data});return r.url}
function pick(multi){return new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept="image/png,image/jpeg,image/webp,image/gif";i.multiple=!!multi;i.onchange=()=>res([...i.files]);i.click()})}
// ---- generic state binding ----
const getp=(o,p)=>p===""?o:p.split(".").reduce((a,k)=>a==null?a:a[k],o);
const setp=(o,p,v)=>{const ks=p.split("."),l=ks.pop();getp(o,ks.join("."))[l]=v};
function bindRoot(root,S,rerender,ro){
 root.oninput=e=>{const t=e.target,p=t.dataset.p;if(p==null)return;let v=t.type=="checkbox"?(t.checked?1:0):t.value;if(t.dataset.lines)v=v.split("\n").map(x=>x.trim()).filter(Boolean);if(t.dataset.num)v=+v||0;setp(S,p,v)};
 root.onchange=e=>{const t=e.target;if(t.dataset.re){rerender()}};
 root.onclick=async e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a,p=b.dataset.p;
  const arr=()=>getp(S,p);
  if(a=="add"){arr().push(clone(JSON.parse(b.dataset.item)));rerender()}
  else if(a=="del"){if(!confirm("حذف؟"))return;const i=+p.split(".").pop(),ap=p.split(".").slice(0,-1).join(".");getp(S,ap).splice(i,1);rerender()}
  else if(a=="up"||a=="down"){const ps=p.split("."),i=+ps.pop(),A=getp(S,ps.join(".")),j=a=="up"?i-1:i+1;if(j<0||j>=A.length)return;[A[i],A[j]]=[A[j],A[i]];rerender()}
  else if(a=="img"){const f=(await pick(false))[0];if(!f)return;b.disabled=1;b.textContent="جاري الرفع…";try{setp(S,p,await uploadFile(f))}catch(x){alert(x.message)}rerender()}
  else if(a=="rmimg"){setp(S,p,"");rerender()}
  else if(a=="imgs"){const fs=await pick(true);if(!fs.length)return;b.disabled=1;b.textContent="جاري الرفع…";try{for(const f of fs)arr().push(await uploadFile(f))}catch(x){alert(x.message)}rerender()}
  else if(a=="delimg"){const i=+p.split(".").pop(),ap=p.split(".").slice(0,-1).join(".");getp(S,ap).splice(i,1);rerender()}
  else if(a=="bulk"){const fs=await pick(true);if(!fs.length)return;b.disabled=1;b.textContent="جاري الرفع…";try{for(const f of fs){const u=await uploadFile(f);arr().push({img:u})}}catch(x){alert(x.message)}rerender()}
 };
 if(ro){root.querySelectorAll("input,textarea,select,button[data-a]").forEach(e=>e.disabled=1);root.querySelectorAll(".save").forEach(e=>e.remove())}}
const saveBar=(label="حفظ")=>`<div class="save"><button class="btn" id="sv">${label}</button><span id="sm" class="mute"></span></div>`;
async function doSave(fn){const b=$("#sv"),m=$("#sm");b.disabled=1;m.className="mute";m.textContent="جاري الحفظ…";try{await fn();m.className="ok";m.textContent="اتحفظ ✓"}catch(e){m.className="err";m.textContent=e.message}b.disabled=0}
const ib=(a,p,t,l)=>`<button type="button" class="ib" data-a="${a}" data-p="${p}" title="${t}">${l}</button>`;
// field renderers
function fld(p,f,o){const[k,l,ty,sub]=f,pp=p?p+"."+k:k,v=o[k];
 if(ty=="ta")return`<label class="f">${l}</label><textarea data-p="${pp}">${esc(v)}</textarea>`;
 if(ty=="img")return`<label class="f">${l}</label><div class="thumb">${v?`<img src="${esc(v)}" alt="">`:""}<button type="button" class="btn o s" data-a="img" data-p="${pp}">${v?"تغيير":"رفع صورة"}</button>${v?`<button type="button" class="btn r s" data-a="rmimg" data-p="${pp}">إزالة</button>`:""}</div>`;
 if(ty=="imgs")return`<label class="f">${l}</label><div class="imgs">${(v||[]).map((u,i)=>`<div><img src="${esc(u)}" alt="" style="width:84px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)"><button type="button" class="x" data-a="delimg" data-p="${pp}.${i}">×</button></div>`).join("")}</div><button type="button" class="btn o s" data-a="imgs" data-p="${pp}">+ رفع صور</button>`;
 if(ty=="sub")return`<label class="f">${l}</label>${(v||[]).map((x,i)=>itemHtml(pp+"."+i,sub.fields,x,sub.label(x,i),true)).join("")}<button type="button" class="btn o s" data-a="add" data-p="${pp}" data-item='${esc(JSON.stringify(sub.item()))}'>+ إضافة قسم</button>`;
 return`<label class="f">${l}</label><input type="text" data-p="${pp}" value="${esc(v)}">`}
function itemHtml(p,fields,o,label,small){return`<div class="item"><div class="hd"><b>${esc(label)}</b>${ib("up",p,"فوق","↑")}${ib("down",p,"تحت","↓")}${ib("del",p,"حذف","🗑")}</div>${fields.map(f=>fld(p,f,o)).join("")}</div>`}
const V={};
V.home=async(m,o)=>{m.innerHTML=`<h2>أهلاً 👋</h2><div class="stats">${can("bookings")?`<div class="stat"><b>${o.upcoming||0}</b><span>حجوزات جاية</span></div>`:""}${can("briefs")?`<div class="stat"><b>${o.unread||0}</b><span>بريفات جديدة</span></div>`:""}${can("slots")?`<div class="stat"><b>${o.open||0}</b><span>مواعيد متاحة</span></div>`:""}</div><div class="card"><h3>ابدأ من هنا</h3><p class="mute">ضيف مواعيدك الفاضية من "المواعيد"، وعدّل محتوى الموقع من "المزيد". أي حجز أو بريف جديد هيوصلك على تليجرام وعلى موبايلك.</p></div>`};
V.more=async m=>{const ks=["texts","lists","media","bform","look","notif","admins"].filter(vis);m.innerHTML=`<h2>المزيد</h2><div class="card menu">${ks.map(k=>`<a data-g="${k}"><span>${PG[k][0]} ${PG[k][1]}</span><span class="mute">‹</span></a>`).join("")}</div>`;m.querySelectorAll("[data-g]").forEach(a=>a.onclick=()=>go(a.dataset.g))};
// ---- bookings / slots / briefs ----
V.book=async m=>{const d=await api("bookings_list");m.innerHTML=`<h2>الحجوزات</h2><div class="card">${d.length?d.map(x=>`<div class="it"><div><h4>${esc(x.name)}</h4><p>${x.p2_slots?fdt(x.p2_slots.starts_at):""}</p><p>🏷 ${esc(x.activity)}</p><p dir="ltr" style="text-align:right">${esc(x.phone)}</p></div><div style="display:flex;flex-direction:column;gap:6px"><a class="btn s" href="https://wa.me/${esc(x.phone.replace(/\D/g,"").replace(/^0/,"20"))}" target="_blank">واتساب</a>${can("bookings",2)?`<button class="btn r s" data-d="${x.id}">إلغاء</button>`:""}</div></div>`).join(""):'<p class="mute">مفيش حجوزات لسه.</p>'}</div>`;

 <div class="card"><h3>الافتراضي للزائر</h3><div class="row"><div><label class="f">اللغة</label><select data-p="s.default_lang"><option value="ar" ${f.default_lang=="ar"?"selected":""}>العربي</option><option value="en" ${f.default_lang=="en"?"selected":""}>English</option></select></div><div><label class="f">الإضاءة</label><select data-p="s.default_theme"><option value="light" ${f.default_theme=="light"?"selected":""}>نهاري (أبيض)</option><option value="dark" ${f.default_theme=="dark"?"selected":""}>ليلي (أسود)</option></select></div></div><p class="mute" style="font-size:13px;margin-top:6px">ده لأول زيارة. اللي الزائر يختاره بنفسه بيتحفظ عنده.</p></div>
 <div class="card"><h3>الخطوط</h3>${fsel("en_head","خط العناوين — إنجليزي","en")}${fsel("en_body","خط النص — إنجليزي","en")}${fsel("ar_head","خط العناوين — عربي","ar")}${fsel("ar_body","خط النص — عربي","ar")}<p class="mute" style="font-size:13px;margin-top:6px">الخطوط من Google Fonts.</p></div>
 <div class="card"><h3>الحركة</h3><label class="f">سرعة الشرايط المتحركة: <b id="v1"></b></label><input type="range" data-p="s.marquee_speed" data-num="1" min="0.2" max="3" step="0.1" style="width:100%"><label class="f">سرعة حركة علامة ∞: <b id="v2"></b></label><input type="range" data-p="s.logo_speed" data-num="1" min="0.2" max="3" step="0.1" style="width:100%"></div>
 <div class="card"><h3>التواصل</h3><label class="f">رقم واتساب (بكود الدولة)</label><input type="tel" dir="ltr" data-p="s.whatsapp" value="${esc(f.whatsapp)}" placeholder="201041249535"><h3 style="margin-top:16px">حسابات السوشيال</h3>${f.social.map((x,i)=>`<div class="item"><div class="hd"><b>${esc(x.n||"حساب")}</b>${ib("up","s.social."+i,"فوق","↑")}${ib("down","s.social."+i,"تحت","↓")}${ib("del","s.social."+i,"حذف","🗑")}</div><div class="row"><div><label class="f">الاسم</label><input type="text" data-p="s.social.${i}.n" value="${esc(x.n)}"></div><div><label class="f">إظهار في الموقع</label><select data-p="s.social.${i}.v" data-num="1"><option value="1" ${x.v===0?"":"selected"}>ظاهر</option><option value="0" ${x.v===0?"selected":""}>مخفي</option></select></div></div><label class="f">الرابط (https://…)</label><input type="text" dir="ltr" data-p="s.social.${i}.u" value="${esc(x.u)}"></div>`).join("")}<button type="button" class="btn o s" data-a="add" data-p="s.social" data-item='${esc(JSON.stringify({n:"",u:"",v:1}))}'>+ إضافة حساب (تيك توك، يوتيوب…)</button></div>
 <div class="card"><h3>عنوان الموقع (تبويب المتصفح)</h3><input type="text" data-p="s.site_title" value="${esc(f.site_title)}" placeholder="Abdelaziz Tamer | Media Buyer"></div>${saveBar()}`;
  const u=()=>{$("#v1").textContent=S.s.marquee_speed+"×";$("#v2").textContent=S.s.logo_speed+"×"};
  m.querySelectorAll('input[type=range]').forEach(e=>{e.value=getp(S,e.dataset.p)});u();
  bindRoot(m,S,()=>{const y=scrollY;render();scrollTo(0,y)},ro);m.addEventListener("input",u);
  m.querySelectorAll("[data-fk]").forEach(sel=>sel.onchange=()=>{const k=sel.dataset.fk;S.s.fonts[k]=sel.value=="__c"?(S.s.fonts[k]||" "):sel.value;render()});
  if(!ro)$("#sv").onclick=()=>doSave(async()=>{const o={...S.s};o.fonts={...o.fonts};Object.keys(o.fonts).forEach(k=>o.fonts[k]=(o.fonts[k]||"").trim());await api("settings_save",{value:o})})};
 render()};
// ---- notifications ----
const b64u=s=>{const p="=".repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,"+").replace(/_/g,"/"),r=atob(b);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
V.notif=async m=>{const k=(await api("push_key")).key,sup="serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;let sub=null;
 if(sup){try{const reg=await navigator.serviceWorker.getRegistration();sub=reg&&await reg.pushManager.getSubscription()}catch(e){}}
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
 m.innerHTML=`<h2>الإشعارات</h2>
 <div class="card"><h3>📱 إشعار على الموبايل</h3>${!k?`<div class="note">إشعارات الموبايل لسه مش متفعلة على السيرفر.${ME.owner?" اضغط الزرار تحت لتوليد المفاتيح وحطها في Vercel (الخطوات تحته).":" اطلب من المالك يفعّلها."}</div>`:""}
 ${ios&&!standalone?`<div class="note">على الآيفون: افتح الداشبورد في Safari ← زرار المشاركة ← <b>Add to Home Screen</b>، وافتحه من الأيقونة، وبعدين فعّل الإشعارات.</div>`:""}
 ${!sup?'<p class="err">المتصفح ده مش بيدعم إشعارات الموبايل.</p>':`<p class="mute" id="ps">${sub?"✅ الإشعارات مفعّلة على الجهاز ده.":"مش مفعّلة على الجهاز ده."}</p><div class="row"><button class="btn" id="pe" ${k?"":"disabled"}>${sub?"إعادة تفعيل":"تفعيل إشعارات الموبايل"}</button>${sub?'<button class="btn o" id="pt">إرسال إشعار تجريبي</button><button class="btn r" id="pd">إيقاف</button>':""}</div><div id="pm"></div>`}
 ${ME.owner?`<hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><button class="btn o" id="vg">توليد مفاتيح الإشعارات (VAPID)</button><div id="vo"></div>`:""}</div>
 ${ME.owner?`<div class="card"><h3>✈️ تليجرام</h3><p class="mute">ابعت رسالة تجريبية للتأكد إن الإشعارات واصلة.</p><button class="btn o" id="tt" style="margin-top:8px">إرسال رسالة تجريبية</button><div id="tm"></div></div>`:""}`;
 const say=(id,t,c)=>{const e=$(id);if(e)e.innerHTML=`<p class="${c||"ok"}">${esc(t)}</p>`};
 if($("#pe"))$("#pe").onclick=async()=>{try{const reg=await navigator.serviceWorker.register("/sw.js");await navigator.serviceWorker.ready;const perm=await Notification.requestPermission();if(perm!="granted")return say("#pm","لازم توافق على الإشعارات من المتصفح","err");
  const s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k)});await api("push_subscribe",{sub:s.toJSON()});say("#pm","اتفعلت ✓ جرّب الإشعار التجريبي");setTimeout(()=>V.notif(m),800)}catch(e){say("#pm",e.message||"فشل التفعيل","err")}};
 if($("#pt"))$("#pt").onclick=async()=>{try{await api("push_test");say("#pm","اتبعت ✓")}catch(e){say("#pm",e.message,"err")}};
 if($("#pd"))$("#pd").onclick=async()=>{try{const reg=await navigator.serviceWorker.getRegistration(),s=reg&&await reg.pushManager.getSubscription();if(s){await api("push_unsubscribe",{endpoint:s.endpoint});await s.unsubscribe()}V.notif(m)}catch(e){say("#pm",e.message,"err")}};
 if($("#vg"))$("#vg").onclick=async()=>{try{const v=await api("vapid_generate");$("#vo").innerHTML=`<div class="note">انسخ القيم دي في Vercel (<b>Settings ← Environment Variables</b>) في <b>مشروعي الموقع والداشبورد معاً</b>، وبعدين Redeploy. <b>ماتبعتهاش لأي حد</b> والمفتاح الخاص سري.</div><label class="f">VAPID_PUBLIC_KEY</label><code>${esc(v.publicKey)}</code><label class="f">VAPID_PRIVATE_KEY</label><code>${esc(v.privateKey)}</code><label class="f">VAPID_SUBJECT</label><code>mailto:${esc(ME.email)}</code>`}catch(e){say("#vo",e.message,"err")}};
 if($("#tt"))$("#tt").onclick=async()=>{try{await api("telegram_test");say("#tm","اتبعتت ✓ شوف تليجرام")}catch(e){say("#tm",e.message,"err")}}};
// ---- admins ----
const PL={bookings:"الحجوزات",slots:"المواعيد",briefs:"البريفات",texts:"نصوص الموقع",lists:"الخدمات والحملات والآراء واللوجوهات",media:"الصور واللوجو",brief_form:"أسئلة البريف",appearance:"المظهر والإعدادات"};
const permH=(id,p)=>Object.keys(PL).map(k=>`<div class="perm"><span>${PL[k]}</span><select data-pk="${k}" data-for="${id}"><option value="0" ${!(p[k]>0)?"selected":""}>ممنوع</option><option value="1" ${p[k]==1?"selected":""}>مشاهدة</option><option value="2" ${p[k]==2?"selected":""}>تعديل</option></select></div>`).join("");
const readP=id=>{const o={};document.querySelectorAll(`[data-for="${id}"]`).forEach(s=>o[s.dataset.pk]=+s.value);return o};
V.admins=async m=>{const L=await api("admins_list");
 m.innerHTML=`<h2>المشرفين</h2><p class="mute" style="margin-bottom:12px">المشرف بيدخل بنفس رابط الداشبورد بإيميله وكلمة سره، وبيشوف ويعدّل اللي إنت تسمحله بيه بس.</p>
 ${L.map((a,i)=>`<details class="acc"><summary>${esc(a.email)}</summary><div class="bd">${permH("a"+i,a.perms||{})}<div class="row" style="margin-top:10px"><button class="btn" data-sv="${i}">حفظ الصلاحيات</button><button class="btn o" data-pw="${i}">تغيير كلمة السر</button><button class="btn r" data-rm="${i}">حذف المشرف</button></div><div id="am${i}"></div></div></details>`).join("")}
 <div class="card"><h3>إضافة مشرف</h3><label class="f">الإيميل</label><input type="email" id="ne" dir="ltr"><label class="f">كلمة السر (8 حروف على الأقل)</label><input type="text" id="np" dir="ltr" autocomplete="off">${permH("new",{})}<div id="nm"></div><button class="btn" id="na" style="width:100%;margin-top:8px">إضافة المشرف</button></div>`;
 const say=(id,t,c)=>{$(id).innerHTML=`<p class="${c||"ok"}">${esc(t)}</p>`};
 m.querySelectorAll("[data-sv]").forEach(b=>b.onclick=async()=>{const i=b.dataset.sv;try{await api("admins_update",{email:L[i].email,perms:readP("a"+i)});say("#am"+i,"اتحفظ ✓")}catch(e){say("#am"+i,e.message,"err")}});
 m.querySelectorAll("[data-pw]").forEach(b=>b.onclick=async()=>{const i=b.dataset.pw,p=prompt("كلمة السر الجديدة (8 حروف على الأقل):");if(!p)return;try{await api("admins_password",{email:L[i].email,password:p});say("#am"+i,"اتغيرت ✓")}catch(e){say("#am"+i,e.message,"err")}});
 m.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{const i=b.dataset.rm;if(!confirm("حذف المشرف "+L[i].email+"؟"))return;try{await api("admins_delete",{email:L[i].email});V.admins(m)}catch(e){say("#am"+i,e.message,"err")}});
 $("#na").onclick=async()=>{try{const r=await api("admins_create",{email:$("#ne").value,password:$("#np").value,perms:readP("new")});say("#nm","اتضاف ✓ "+(r.note||""));setTimeout(()=>V.admins(m),1200)}catch(e){say("#nm",e.message,"err")}}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
T&&T.access_token?shell():login();
</script>
