<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم — Abdelaziz Tamer</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f6;--card:#fff;--fg:#0b0b0c;--mute:#6b6b72;--line:#e4e4e7;--ac:#0b0b0c;--acf:#fff;--red:#d92d3a;--grn:#12805c}
*{box-sizing:border-box;margin:0}
body{font:400 15px/1.6 Cairo,system-ui,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top b{font-weight:800;font-size:17px}.top small{color:var(--mute)}
main{max-width:900px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:28px;font-weight:800;line-height:1.2}.stat span{color:var(--mute);font-size:13px}
.btn{border:1px solid var(--ac);background:var(--ac);color:var(--acf);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn.o{background:transparent;color:var(--fg);border-color:var(--line)}.btn.r{background:transparent;color:var(--red);border-color:var(--line)}.btn.s{min-height:36px;padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input[type=tel],select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);min-height:44px}
label.f{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.tabs{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabs button{flex:1;border:0;background:none;padding:6px 2px;border-radius:12px;color:var(--mute);font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button i{font-style:normal;font-size:20px;line-height:1}.tabs button.on{color:var(--fg);background:var(--bg)}
.tabs .dot{position:absolute;top:2px;inset-inline-start:calc(50% + 8px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;min-width:16px;padding:0 4px;line-height:16px}
.it{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:12px 0}.it:last-child{border:0}
.it h4{font-size:16px;font-weight:700}.it p{color:var(--mute);font-size:14px}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line)}.tag.g{color:var(--grn)}.tag.n{background:var(--red);border-color:var(--red);color:#fff}
.mute{color:var(--mute)}.err{color:var(--red);margin:10px 0}.ok{color:var(--grn);margin:10px 0}
h2{font-size:20px;margin:6px 0 12px;font-weight:800}h3{font-size:16px;margin:0 0 8px}
.login{max-width:380px;margin:12vh auto;padding:16px}
.days{display:flex;gap:6px;flex-wrap:wrap}.days label{border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;background:var(--card)}.days label:has(input:checked){background:var(--ac);color:var(--acf)}.days input{display:none}
.bs{margin-top:20px}.bs h3{background:#1a1a2e;color:#fff;border-radius:10px;padding:8px 14px}
.qa{border-bottom:1px solid var(--line);padding:10px 2px}.qa b{display:block;font-size:14px;color:var(--mute)}.qa div{white-space:pre-wrap}
.modal{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:16px 16px 40px}
.modal .in{max-width:760px;margin:auto}
@media print{#app{display:none}.top,.tabs,.noprint{display:none!important}.modal{position:static;padding:0}body{background:#fff}.card{border:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let T=null,tab="home",busy=0;
try{T=JSON.parse(localStorage.getItem("p2t"))}catch(e){}
const save=()=>{try{T?localStorage.setItem("p2t",JSON.stringify(T)):localStorage.removeItem("p2t")}catch(e){}};
async function raw(body,tok){const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json",...(tok?{Authorization:"Bearer "+tok}:{})},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(e){}return{r,d}}
async function api(action,data={}){
  let x=await raw({action,...data},T&&T.access_token);
  if(x.r.status===401&&T&&T.refresh_token){const f=await raw({action:"refresh",refresh_token:T.refresh_token});if(f.r.ok){T={...T,...f.d};save();x=await raw({action,...data},T.access_token)}}
  if(x.r.status===401){T=null;save();login();throw new Error("auth")}
  if(!x.r.ok)throw new Error(x.d.error||"خطأ");return x.d}
// ---- Cairo time helpers ----
const cairoOffset=(y,m,d,h,mi)=>{const g=Date.UTC(y,m-1,d,h,mi);const f=new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Cairo",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});const p=Object.fromEntries(f.formatToParts(new Date(g)).map(x=>[x.type,x.value]));return Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute)-g};
const cairoISO=(ds,tm)=>{const[y,m,d]=ds.split("-").map(Number),[h,mi]=tm.split(":").map(Number);let g=Date.UTC(y,m-1,d,h,mi);let o=cairoOffset(y,m,d,h,mi);g-=o;const o2=cairoOffset(y,m,d,h,mi);if(o2!==o)g=Date.UTC(y,m-1,d,h,mi)-o2;return new Date(g).toISOString()};
const fdt=i=>new Date(i).toLocaleString("ar-EG",{timeZone:"Africa/Cairo",weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit"});
const fd=i=>new Date(i).toLocaleDateString("ar-EG",{timeZone:"Africa/Cairo",weekday:"long",day:"numeric",month:"long"});
const ft=i=>new Date(i).toLocaleTimeString("ar-EG",{timeZone:"Africa/Cairo",hour:"numeric",minute:"2-digit"});
// ---- login ----
function login(msg){app.innerHTML=`<div class="login card"><h2>لوحة التحكم</h2><p class="mute">Abdelaziz Tamer — Media Buyer</p><label class="f">الإيميل</label><input type="email" id="le" autocomplete="username"><label class="f">كلمة السر</label><input type="password" id="lp" autocomplete="current-password"><div class="err" id="lerr">${msg||""}</div><button class="btn" id="lb" style="width:100%">دخول</button></div>`;
 const go=async()=>{$("#lb").disabled=1;const x=await raw({action:"login",email:$("#le").value,password:$("#lp").value});if(x.r.ok){T=x.d;save();shell()}else{$("#lerr").textContent=x.d.error||"حصلت مشكلة";$("#lb").disabled=0}};
 $("#lb").onclick=go;$("#lp").onkeydown=e=>e.key=="Enter"&&go()}
// ---- shell ----
const TABS=[["home","🏠","الرئيسية"],["book","📅","الحجوزات"],["slots","🕒","المواعيد"],["briefs","📝","البريفات"],["set","⚙️","الإعدادات"]];
async function shell(){app.innerHTML=`<div class="top"><div><b>لوحة التحكم</b><br><small>${esc(T.email||"")}</small></div><button class="btn o s" id="lo">خروج</button></div><main id="mn"></main><div class="tabs" id="tb"></div>`;
 $("#lo").onclick=()=>{T=null;save();login()};go(tab)}
async function go(t){tab=t;const n={};try{n.o=await api("overview")}catch(e){if(e.message=="auth")return}
 $("#tb").innerHTML=TABS.map(([k,i,l])=>`<button class="${k==t?"on":""}" data-k="${k}"><i>${i}</i>${l}${k=="briefs"&&n.o&&n.o.unread?`<span class="dot">${n.o.unread}</span>`:""}</button>`).join("");
 $("#tb").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.k));
 const m=$("#mn");m.innerHTML='<p class="mute">جاري التحميل…</p>';
 try{await V[t](m,n.o)}catch(e){if(e.message!="auth")m.innerHTML=`<p class="err">${esc(e.message)}</p>`}}
const V={
async home(m,o){o=o||{};m.innerHTML=`<h2>أهلاً 👋</h2><div class="stats"><div class="stat"><b>${o.upcoming||0}</b><span>حجوزات جاية</span></div><div class="stat"><b>${o.unread||0}</b><span>بريفات جديدة</span></div><div class="stat"><b>${o.open||0}</b><span>مواعيد متاحة</span></div></div><div class="card"><h3>ابدأ من هنا</h3><p class="mute">ضيف مواعيدك الفاضية من تاب "المواعيد"، والعميل هيشوفها ويحجز. أي حجز أو بريف جديد هيوصلك على تليجرام.</p></div><div class="card"><h3>المرحلة الجاية</h3><p class="mute">تعديل محتوى الموقع (الصور، النصوص، الأسئلة، اللوجوهات، الخطوط)، والمشرفين وصلاحياتهم، وربط ميتا وتيك توك.</p></div>`},
async book(m){const d=await api("bookings_list");m.innerHTML=`<h2>الحجوزات</h2><div class="card">${d.length?d.map(x=>`<div class="it"><div><h4>${esc(x.name)}</h4><p>${x.p2_slots?fdt(x.p2_slots.starts_at):""}</p><p>🏷 ${esc(x.activity)}</p><p dir="ltr" style="text-align:right">${esc(x.phone)}</p></div><div style="display:flex;flex-direction:column;gap:6px"><a class="btn s" href="https://wa.me/${esc(x.phone.replace(/\D/g,"").replace(/^0/,"20"))}" target="_blank" style="text-decoration:none;text-align:center">واتساب</a><button class="btn r s" data-d="${x.id}">إلغاء</button></div></div>`).join(""):'<p class="mute">مفيش حجوزات لسه.</p>'}</div>`;
 m.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(!confirm("إلغاء الحجز؟ الميعاد هيرجع متاح للعملاء."))return;await api("booking_delete",{id:b.dataset.d});go("book")})},
async slots(m){const d=await api("slots_list");const today=new Date().toLocaleDateString("en-CA",{timeZone:"Africa/Cairo"});
 const G={};d.forEach(s=>(G[fd(s.starts_at)]=G[fd(s.starts_at)]||[]).push(s));
 m.innerHTML=`<h2>المواعيد</h2><div class="card"><h3>إضافة مواعيد فاضية</h3><div class="row"><div><label class="f">من يوم</label><input type="date" id="d1" value="${today}"></div><div><label class="f">لحد يوم</label><input type="date" id="d2" value="${today}"></div></div><label class="f">الأيام</label><div class="days" id="dy">${["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"].map((n,i)=>`<label><input type="checkbox" value="${i}" ${i!=5?"checked":""}>${n}</label>`).join("")}</div><div class="row"><div><label class="f">من ساعة</label><input type="time" id="t1" value="14:00"></div><div><label class="f">لحد ساعة</label><input type="time" id="t2" value="18:00"></div><div><label class="f">مدة الميتينج (دقيقة)</label><input type="number" id="du" value="30" min="10" step="5"></div></div><div class="err" id="se"></div><button class="btn" id="sa" style="margin-top:12px;width:100%">إضافة المواعيد</button><p class="mute" style="margin-top:8px;font-size:13px">بتوقيت القاهرة. المواعيد بتتقسم تلقائي حسب المدة (مثلاً 2:00 و2:30 و3:00…).</p></div><div class="card"><h3>المواعيد الجاية</h3>${Object.keys(G).length?Object.entries(G).map(([day,a])=>`<div class="bs"><h3>${day}</h3>${a.map(s=>{const bk=s.p2_bookings;return`<div class="it"><div><b>${ft(s.starts_at)}</b> <span class="tag ${bk?"n":"g"}">${bk?"محجوز — "+esc(bk.name||""):"متاح"}</span></div>${bk?"":`<button class="btn r s" data-d="${s.id}">حذف</button>`}</div>`}).join("")}</div>`).join(""):'<p class="mute">مفيش مواعيد. ضيف من فوق.</p>'}</div>`;
 m.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{await api("slot_delete",{id:b.dataset.d});go("slots")});
 $("#sa").onclick=async()=>{const e=$("#se");e.textContent="";const d1=$("#d1").value,d2=$("#d2").value,t1=$("#t1").value,t2=$("#t2").value,du=Math.max(10,+$("#du").value||30),days=[...document.querySelectorAll("#dy input:checked")].map(x=>+x.value);
  if(!d1||!d2||!t1||!t2||d2<d1||!days.length){e.textContent="راجع التواريخ والأيام والساعات";return}
  const[h1,m1]=t1.split(":").map(Number),[h2,m2]=t2.split(":").map(Number),a=h1*60+m1,z=h2*60+m2;if(z<=a){e.textContent="ساعة النهاية لازم تكون بعد البداية";return}
  const items=[];for(let c=new Date(d1+"T12:00:00Z");c<=new Date(d2+"T12:00:00Z");c.setUTCDate(c.getUTCDate()+1)){if(!days.includes(c.getUTCDay()))continue;const ds=c.toISOString().slice(0,10);for(let x=a;x+du<=z;x+=du)items.push(cairoISO(ds,String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")))}
  if(!items.length){e.textContent="مفيش مواعيد طلعت، راجع الإعدادات";return}if(items.length>500){e.textContent="كتير أوي (أقصى 500 موعد مرة واحدة)";return}
  $("#sa").disabled=1;try{await api("slots_add",{items,duration:du});go("slots")}catch(x){e.textContent=x.message;$("#sa").disabled=0}}},
async briefs(m){const d=await api("briefs_list");m.innerHTML=`<h2>البريفات</h2><div class="card">${d.length?d.map(x=>`<div class="it" style="cursor:pointer" data-b="${x.id}"><div><h4>${esc(x.brand_name||x.client_name||"—")} ${x.is_read?"":'<span class="tag n">جديد</span>'}</h4><p>${esc(x.client_name||"")} · <span dir="ltr">${esc(x.phone||"")}</span></p><p>${fdt(x.created_at)}</p></div><span class="mute">‹</span></div>`).join(""):'<p class="mute">مفيش بريفات لسه.</p>'}</div>`;
 m.querySelectorAll("[data-b]").forEach(r=>r.onclick=()=>brief(r.dataset.b))},
async set(m){const s=await api("settings_get");m.innerHTML=`<h2>الإعدادات</h2><div class="card"><h3>التواصل</h3><label class="f">رقم واتساب (بكود الدولة)</label><input type="tel" id="wa" dir="ltr" value="${esc(s.whatsapp||"")}" placeholder="201041249535"><label class="f">رابط فيسبوك</label><input type="text" id="fb" dir="ltr" value="${esc(s.facebook||"")}" placeholder="https://facebook.com/…"><label class="f">رابط إنستجرام</label><input type="text" id="ig" dir="ltr" value="${esc(s.instagram||"")}" placeholder="https://instagram.com/…"></div><div class="card"><h3>الحركة</h3><label class="f">سرعة الشرايط المتحركة: <b id="v1"></b></label><input type="range" id="ms" min="0.2" max="3" step="0.1" style="width:100%"><label class="f">سرعة حركة اللوجو (شكل ∞): <b id="v2"></b></label><input type="range" id="ls" min="0.2" max="3" step="0.1" style="width:100%"></div><div id="sm"></div><button class="btn" id="ss" style="width:100%">حفظ</button><div class="card" style="margin-top:14px"><h3>إشعارات تليجرام</h3><p class="mute">ابعت رسالة تجريبية للتأكد إن الإشعارات واصلة.</p><button class="btn o" id="tt" style="margin-top:8px">إرسال رسالة تجريبية</button><div id="tm"></div></div>`;
 $("#ms").value=s.marquee_speed||1;$("#ls").value=s.logo_speed||1;const u=()=>{$("#v1").textContent=$("#ms").value+"×";$("#v2").textContent=$("#ls").value+"×"};u();$("#ms").oninput=$("#ls").oninput=u;
 $("#ss").onclick=async()=>{try{await api("settings_save",{value:{whatsapp:$("#wa").value,facebook:$("#fb").value,instagram:$("#ig").value,marquee_speed:$("#ms").value,logo_speed:$("#ls").value}});$("#sm").innerHTML='<p class="ok">اتحفظ ✓</p>'}catch(e){$("#sm").innerHTML=`<p class="err">${esc(e.message)}</p>`}};
 $("#tt").onclick=async()=>{try{await api("telegram_test");$("#tm").innerHTML='<p class="ok">اتبعتت ✓ شوف تليجرام</p>'}catch(e){$("#tm").innerHTML=`<p class="err">${esc(e.message)}</p>`}}}
};
async function brief(id){const b=await api("brief_get",{id});if(!b)return;const G=[];(b.answers||[]).forEach(a=>{let g=G[G.length-1];if(!g||g.s!=a.s){g={s:a.s,i:[]};G.push(g)}g.i.push(a)});
 const o=document.createElement("div");o.className="modal";o.innerHTML=`<div class="in"><div class="row noprint" style="margin-bottom:12px"><button class="btn o" id="bx">‹ رجوع</button><button class="btn o" id="bp">طباعة / PDF</button><button class="btn r" id="bd">حذف</button></div><div class="card"><h2>${esc(b.brand_name||"بريف")}</h2><p class="mute">${esc(b.client_name||"")} · <span dir="ltr">${esc(b.phone||"")}</span> · ${fdt(b.created_at)}</p></div>${G.map((g,i)=>`<div class="bs"><h3>${i+1}. ${esc(g.s)}</h3><div class="card">${g.i.map(a=>`<div class="qa"><b>${esc(a.q)}</b><div>${esc(a.a)}</div></div>`).join("")}</div></div>`).join("")}</div>`;
 document.body.appendChild(o);const c=()=>{o.remove();go("briefs")};o.querySelector("#bx").onclick=c;o.querySelector("#bp").onclick=()=>print();o.querySelector("#bd").onclick=async()=>{if(confirm("حذف البريف نهائياً؟")){await api("brief_delete",{id});c()}}}
T&&T.access_token?shell():login();
</script>
</body>
</html>
